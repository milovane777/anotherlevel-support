<!doctype html>
<meta charset="utf-8">
<title>asset relay</title>
<p>asset relay — App Store Connect 업로드용 임시 페이지 (업로드 후 삭제)</p>
<script>
const ASC = 'https://appstoreconnect.apple.com';
window.addEventListener('message', async (e) => {
  if (e.origin !== ASC || !e.data || e.data.type !== 'relay-get') return;
  const path = String(e.data.path || '');
  if (!/^[\w\-./]+\.png$/.test(path) || path.includes('..')) {
    e.source.postMessage({type: 'relay-err', path, err: 'bad path'}, ASC); return;
  }
  try {
    const r = await fetch('./shots/' + path, {cache: 'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const buf = await r.arrayBuffer();
    e.source.postMessage({type: 'relay-file', path, buf}, ASC, [buf]);
  } catch (err) {
    e.source.postMessage({type: 'relay-err', path, err: String(err)}, ASC);
  }
});
if (window.parent !== window) window.parent.postMessage({type: 'relay-ready'}, ASC);
</script>
